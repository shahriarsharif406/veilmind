name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path veilcore/Cargo.toml
      - run: cargo build --release --manifest-path veilcore/Cargo.toml
      - run: mkdir -p bin && cp veilcore/target/release/veilcore bin/
      - run: pip install pytest && python -m pytest -q tests
