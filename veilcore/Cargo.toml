[package]
name = "veilcore"
version = "0.1.0"
edition = "2021"
description = "Veilmind crypto core: Shamir secret sharing over GF(256) + AES-256-GCM, memory-zeroized"

[dependencies]
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
hex = "0.4"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
